<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrar Catálogo | Wellsshop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #1e293b;
    --green: #10b981;
    --green-dark: #059669;
    --red: #ef4444;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 60px;
  }
  header {
    background: var(--accent);
    color: white;
    padding: 28px 20px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
  header p { margin: 6px 0 0; color: #94a3b8; font-size: 0.9rem; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 18px; }

  /* --- Pantalla de clave --- */
  #loginBox {
    max-width: 360px; margin: 80px auto; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 36px 28px;
  }
  #loginBox h2 { margin: 0 0 6px; font-size: 1.2rem; }
  #loginBox p { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }

  input, textarea, select {
    width: 100%; font-family: inherit; font-size: 1rem;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--green); outline-offset: 1px; }

  button {
    font-family: inherit; font-weight: 600; font-size: 1rem;
    border: none; border-radius: 10px; cursor: pointer;
    padding: 13px 18px; width: 100%;
  }
  .btn-primary { background: var(--green); color: white; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:disabled { background: #a7f3d0; cursor: not-allowed; }
  .btn-danger { background: #fee2e2; color: #991b1b; width: auto; padding: 8px 14px; font-size: 0.85rem; }
  .btn-danger:hover { background: #fecaca; }

  section.card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; margin-bottom: 22px;
  }
  section.card h2 { margin: 0 0 16px; font-size: 1.05rem; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

  #estadoAgregar { margin-top: 12px; font-size: 0.9rem; display: none; padding: 10px 12px; border-radius: 8px; }
  .ok { background: #d1fae5; color: #065f46; display: block !important; }
  .error { background: #fee2e2; color: #991b1b; display: block !important; }

  .producto-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .producto-row:last-child { border-bottom: none; }
  .producto-row img {
    width: 56px; height: 56px; object-fit: contain; background: #f1f5f9;
    border-radius: 8px; flex-shrink: 0;
  }
  .producto-info { flex-grow: 1; min-width: 0; }
  .producto-info .nombre { font-weight: 600; font-size: 0.95rem; }
  .producto-info .precio { color: var(--green-dark); font-size: 0.85rem; font-weight: 600; }

  #listaEstado { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <h1>Administrar Catálogo</h1>
  <p>Wellsshop — agregar y eliminar productos</p>
</header>

<div id="loginBox">
  <h2>Ingresá la clave</h2>
  <p>Es la misma que te dio tu hijo.</p>
  <div class="field">
    <input type="password" id="passwordInput" placeholder="Clave">
  </div>
  <button class="btn-primary" id="btnEntrar">Entrar</button>
  <div id="loginError" style="color:#991b1b; font-size:0.85rem; margin-top:10px;"></div>
</div>

<div class="wrap" id="panel" style="display:none;">

  <div style="text-align:right; margin-bottom:10px;">
    <button id="btnSalir" style="width:auto; background:none; color:var(--muted); font-size:0.85rem; padding:6px 10px; text-decoration:underline;">Cerrar sesión</button>
  </div>

  <section class="card">
    <h2>➕ Agregar producto nuevo</h2>
    <div class="field">
      <label for="nombre">Marca y modelo</label>
      <input type="text" id="nombre" placeholder="Ej: Rolex Submariner">
    </div>
    <div class="field">
      <label for="precio">Precio</label>
      <input type="text" id="precio" placeholder="Ej: 300000 o Consultar">
    </div>
    <div class="field">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" rows="2" placeholder="Ej: Reloj Rolex Submariner Negro"></textarea>
    </div>
    <div class="field">
      <label for="categoria">Categoría</label>
      <select id="categoria">
        <option value="relojes">Relojes</option>
        <option value="carteras">Carteras</option>
        <option value="lentes">Lentes</option>
        <option value="gadgets">Gadgets</option>
      </select>
    </div>
    <div class="field">
      <label for="foto">Foto del producto</label>
      <input type="file" id="foto" accept="image/*">
    </div>
    <button class="btn-primary" id="btnAgregar">Guardar y publicar</button>
    <div id="estadoAgregar"></div>
  </section>

  <section class="card">
    <h2>🗑️ Productos actuales</h2>
    <div id="listaEstado">Cargando...</div>
    <div id="listaProductos"></div>
  </section>

</div>

<script>
  // ⚠️ Pegá aquí la URL de tu Worker de Cloudflare (paso 5 de las instrucciones)
  const WORKER_URL = "https://wellsshop-api.relojesoscar-ok.workers.dev";

  const CATALOGO_URL = "../products.json"; // products.json vive un nivel arriba (raíz del sitio)
  const IMG_BASE = "../img/";

  let clave = "";
  const CLAVE_GUARDADA = "wellsshop_admin_clave";

  const loginBox = document.getElementById("loginBox");
  const panel = document.getElementById("panel");
  const passwordInput = document.getElementById("passwordInput");
  const loginError = document.getElementById("loginError");
  const btnEntrar = document.getElementById("btnEntrar");

  async function verificarClave(intento) {
    try {
      const resp = await fetch(WORKER_URL + "/verificar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: intento }),
      });
      return resp.ok;
    } catch (e) {
      loginError.textContent = "No se pudo conectar con el servidor. Revisá tu conexión.";
      return false;
    }
  }

  function entrarAlPanel() {
    loginBox.style.display = "none";
    panel.style.display = "block";
    cargarProductos();
  }

  async function intentarEntrar() {
    const intento = passwordInput.value.trim();
    if (!intento) { loginError.textContent = "Escribí la clave."; return; }
    loginError.textContent = "";
    btnEntrar.disabled = true;
    btnEntrar.textContent = "Verificando...";

    const ok = await verificarClave(intento);

    btnEntrar.disabled = false;
    btnEntrar.textContent = "Entrar";

    if (!ok) {
      loginError.textContent = "Clave incorrecta.";
      return;
    }
    clave = intento;
    localStorage.setItem(CLAVE_GUARDADA, clave);
    entrarAlPanel();
  }

  btnEntrar.onclick = intentarEntrar;
  passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") intentarEntrar();
  });

  document.getElementById("btnSalir").onclick = () => {
    localStorage.removeItem(CLAVE_GUARDADA);
    clave = "";
    passwordInput.value = "";
    panel.style.display = "none";
    loginBox.style.display = "block";
  };

  // Si ya habíamos guardado la clave en este dispositivo, entramos directo
  (async () => {
    const guardada = localStorage.getItem(CLAVE_GUARDADA);
    if (guardada) {
      const ok = await verificarClave(guardada);
      if (ok) {
        clave = guardada;
        entrarAlPanel();
      } else {
        localStorage.removeItem(CLAVE_GUARDADA);
      }
    }
  })();

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("btnAgregar").onclick = async () => {
    const nombre = document.getElementById("nombre").value.trim();
    const precio = document.getElementById("precio").value.trim();
    const descripcion = document.getElementById("descripcion").value.trim();
    const categoria = document.getElementById("categoria").value;
    const fotoInput = document.getElementById("foto");
    const estado = document.getElementById("estadoAgregar");
    const boton = document.getElementById("btnAgregar");

    estado.className = ""; estado.style.display = "none";

    if (!nombre || !precio || !fotoInput.files[0]) {
      estado.textContent = "Completá marca/modelo, precio y elegí una foto.";
      estado.className = "error";
      return;
    }

    boton.disabled = true;
    boton.textContent = "Guardando...";

    try {
      const archivo = fotoInput.files[0];
      const imagenBase64 = await fileToBase64(archivo);
      const ext = archivo.name.split(".").pop();

      const resp = await fetch(WORKER_URL + "/agregar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: clave, nombre, precio, descripcion, categoria, imagenBase64, imagenExt: ext }),
      });
      const data = await resp.json();

      if (!resp.ok) throw new Error(data.error || "Error desconocido");

      estado.textContent = "¡Producto agregado y publicado! Puede demorar 1 minuto en verse en la web.";
      estado.className = "ok";
      document.getElementById("nombre").value = "";
      document.getElementById("precio").value = "";
      document.getElementById("descripcion").value = "";
      fotoInput.value = "";
      cargarProductos();
    } catch (e) {
      estado.textContent = "No se pudo guardar: " + e.message;
      estado.className = "error";
    } finally {
      boton.disabled = false;
      boton.textContent = "Guardar y publicar";
    }
  };

  async function cargarProductos() {
    const listaEstado = document.getElementById("listaEstado");
    const listaProductos = document.getElementById("listaProductos");
    listaEstado.textContent = "Cargando...";
    listaProductos.innerHTML = "";

    try {
      const resp = await fetch(CATALOGO_URL + "?t=" + Date.now());
      const productos = await resp.json();

      if (productos.length === 0) {
        listaEstado.textContent = "No hay productos cargados todavía.";
        return;
      }
      listaEstado.textContent = "";

      productos.forEach((p) => {
        const row = document.createElement("div");
        row.className = "producto-row";
        row.innerHTML = `
          <img src="${IMG_BASE}${p.imagen}" onerror="this.style.opacity=0.2">
          <div class="producto-info">
            <div class="nombre">${p.nombre} <span style="color:var(--muted); font-weight:400; font-size:0.8rem;">(${p.categoria || 'sin categoría'})</span></div>
            <div class="precio">$${p.precio}</div>
          </div>
          <button class="btn-danger" data-imagen="${p.imagen}">Eliminar</button>
        `;
        row.querySelector("button").onclick = (e) => eliminarProducto(p.imagen, p.nombre, e.target);
        listaProductos.appendChild(row);
      });
    } catch (e) {
      listaEstado.textContent = "No se pudo cargar el catálogo: " + e.message;
    }
  }

  async function eliminarProducto(imagen, nombre, boton) {
    if (!confirm(`¿Eliminar "${nombre}" del catálogo? Esta acción no se puede deshacer.`)) return;
    boton.disabled = true;
    boton.textContent = "Eliminando...";
    try {
      const resp = await fetch(WORKER_URL + "/eliminar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: clave, imagen }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Error desconocido");
      cargarProductos();
    } catch (e) {
      alert("No se pudo eliminar: " + e.message);
      boton.disabled = false;
      boton.textContent = "Eliminar";
    }
  }
</script>

</body>
</html>
