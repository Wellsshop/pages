<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellsshop | Catálogo</title>
    <!-- Fuente moderna e importada de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #1e293b;
            --whatsapp-color: #10b981;
            --whatsapp-hover: #059669;
            --border-color: #e2e8f0;

            /* Fondo inicial (relojes). Lo cambia el JS al tocar cada categoría */
            --fondo-img: url('fondo.jpg');
            --fondo-size: 420px;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0 0 50px 0; 
            background: var(--bg-color); 
            color: var(--text-main);
            position: relative;
            min-height: 100vh;
        }

        /* PATRÓN DE FONDO SUTIL (cambia según la categoría) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: var(--fondo-img);
            background-repeat: repeat;
            background-size: var(--fondo-size) auto;
            opacity: 0.06;
            z-index: -1;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        body.cambiando-fondo::before { opacity: 0; }

        /* ENCABEZADO ESTILO BOUTIQUE */
        header {
            background: var(--accent-color);
            color: white;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h1 { 
            margin: 0; 
            font-size: 2.2rem; 
            font-weight: 700; 
            letter-spacing: -0.5px;
        }

        p.subtitle { 
            margin: 10px 0 0 0; 
            color: #94a3b8; 
            font-size: 0.95rem; 
            font-weight: 300;
        }

        /* BARRA DE CATEGORÍAS */
        .categorias {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 0 20px;
        }

        .cat-btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .cat-btn.activo {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* GRILLA DE PRODUCTOS */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px; 
        }

        /* TARJETAS */
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            padding: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01); 
            text-align: left; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.08);
        }
        
        .card-image-wrapper {
            display: block;
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
            background-color: #f1f5f9;
            position: relative;
        }
        
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            transition: transform 0.3s ease;
        }
        
        .card-image-wrapper:hover img {
            transform: scale(1.06);
        }

        .card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }

        .price { 
            font-weight: 700; 
            color: #047857; 
            font-size: 1.25rem; 
            margin: 5px 0 10px 0; 
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0 0 15px 0;
            line-height: 1.4;
            flex-grow: 1;
        }

        .btn-whatsapp { 
            display: flex; 
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--whatsapp-color); 
            color: white; 
            padding: 10px 15px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.9rem;
            transition: background 0.2s ease;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
        }
        
        .btn-whatsapp:hover { 
            background: var(--whatsapp-hover); 
        }

        #error-msg {
            max-width: 600px;
            margin: 20px auto;
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        /* VENTANA FLOTANTE (MODAL) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .close-btn {
            position: absolute;
            top: 25px;
            right: 30px;
            color: #fff;
            font-size: 35px;
            font-weight: 300;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <h1>Wellsshop</h1>
        <p class="subtitle">Toca cualquier imagen para ampliarla. Selecciona "Consultar por WhatsApp" para realizar tu pedido.</p>
    </header>

    <div class="categorias" id="barra-categorias"></div>

    <div id="error-msg"></div>
    <div class="grid" id="catalogo-productos"></div>

    <!-- MODAL -->
    <div id="imageModal" class="modal">
        <span class="close-btn" id="closeModal">&times;</span>
        <img class="modal-content" id="modalImg" alt="Imagen ampliada">
    </div>

    <script>
        (() => {
            const numeroWhatsApp = "5491159828985";
            const contenedor = document.getElementById("catalogo-productos");
            const barraCategorias = document.getElementById("barra-categorias");

            // Nombres lindos para mostrar en los botones (agregá acá si sumás categorías nuevas)
            const NOMBRES_CATEGORIA = {
                relojes: "Relojes",
                carteras: "Carteras",
                lentes: "Lentes",
                gadgets: "Gadgets",
            };

            // Fondo de cada categoría (los archivos van en la raíz del sitio, junto al index.html)
            const FONDOS = {
                relojes: "fondo.jpg",
                carteras: "Fondo_Carteras.png",
                lentes: "Fondo_Lentes.png",
                gadgets: "Fondo_Gadgets.png",
                todos: "Fondo_Varios.png",
            };

            // Orden en que aparecen los botones. "todos" siempre va al final.
            const ORDEN_CATEGORIAS = ["relojes", "carteras", "lentes", "gadgets"];

            let categoriaActiva = "relojes";

            // Probamos varias ubicaciones y formas de escribir el nombre, así funciona
            // tanto si las fotos están en la raíz como dentro de img/ o fondos/,
            // y tanto si el nombre lleva guión bajo como espacio.
            function rutasPosibles(archivo) {
                const variantes = [archivo, archivo.replace(/_/g, " "), archivo.replace(/ /g, "_")];
                const carpetas = ["", "img/", "fondos/"];
                const lista = [];
                carpetas.forEach(c => variantes.forEach(v => {
                    const ruta = c + v;
                    if (!lista.includes(ruta)) lista.push(ruta);
                }));
                return lista;
            }

            const fondoResuelto = {}; // guardamos la ruta que funcionó para no buscar de nuevo

            function aplicarFondo(cat) {
                const archivo = FONDOS[cat] || FONDOS.todos;
                document.body.classList.add("cambiando-fondo");

                const mostrar = (ruta) => {
                    fondoResuelto[cat] = ruta;
                    document.documentElement.style.setProperty("--fondo-img", `url('${ruta}')`);
                    document.body.classList.remove("cambiando-fondo");
                };

                if (fondoResuelto[cat]) { mostrar(fondoResuelto[cat]); return; }

                const candidatos = rutasPosibles(archivo);
                let i = 0;
                const probar = () => {
                    if (i >= candidatos.length) {
                        // No se encontró ninguna: dejamos el fondo anterior en vez de una pantalla pelada
                        console.warn("No se encontró el fondo de " + cat + " (" + archivo + ")");
                        document.body.classList.remove("cambiando-fondo");
                        return;
                    }
                    const ruta = candidatos[i++];
                    const img = new Image();
                    img.onload = () => mostrar(ruta);
                    img.onerror = probar;
                    img.src = encodeURI(ruta);
                };
                probar();
            }

            function pintarProductos(productos) {
                contenedor.innerHTML = "";
                const visibles = categoriaActiva === "todos"
                    ? productos
                    : productos.filter(p => (p.categoria || "").toLowerCase() === categoriaActiva);

                if (visibles.length === 0) {
                    contenedor.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">No hay productos en esta categoría todavía.</p>';
                    return;
                }

                visibles.forEach((prod) => {
                    if (!prod.imagen) return;
                    const imagen = String(prod.imagen).trim();
                    if (imagen === "" || imagen.toLowerCase() === "undefined" || imagen.toLowerCase() === "null") return;

                    const nombre = prod.nombre ? String(prod.nombre).trim() : 'Producto';
                    let precio = prod.precio !== undefined ? prod.precio : 'Consultar';

                    if (typeof precio === 'number') {
                        precio = '$' + precio.toLocaleString('es-AR');
                    } else {
                        precio = '$' + precio;
                    }

                    const descripcion = prod.descripcion ? String(prod.descripcion).trim() : '';

                    const urlFoto = `${window.location.origin}${window.location.pathname.replace(/\/$/, '')}/img/${imagen}`;
                    const textoMensaje = encodeURIComponent(`Hola! Me interesa este producto:\n\n*${nombre}*\nPrecio: ${precio}\nFoto: ${urlFoto}`);

                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="card-image-wrapper" onclick="abrirModal('img/${imagen}')" title="Ampliar imagen">
                            <img src="img/${imagen}" alt="${nombre}" onerror="this.closest('.card').remove();">
                        </div>
                        <h3>${nombre}</h3>
                        <div class="price">${precio}</div>
                        <p>${descripcion}</p>
                        <a href="https://wa.me/${numeroWhatsApp}?text=${textoMensaje}" class="btn-whatsapp" target="_blank">
                            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                            Consultar por WhatsApp
                        </a>
                    `;
                    contenedor.appendChild(card);
                });
            }

            function pintarBotonesCategoria(productos) {
                // Solo mostramos botones de las categorías que realmente tienen productos
                const presentes = [...new Set(productos.map(p => (p.categoria || "").toLowerCase()).filter(Boolean))];

                if (presentes.length <= 1) {
                    // Con una sola categoría no tienen sentido los filtros
                    barraCategorias.style.display = "none";
                    categoriaActiva = presentes[0] || "todos";
                    aplicarFondo(categoriaActiva);
                    return;
                }

                // Orden: primero las que definimos a mano, después cualquier categoría nueva, y "Todos" al final
                const ordenadas = [
                    ...ORDEN_CATEGORIAS.filter(c => presentes.includes(c)),
                    ...presentes.filter(c => !ORDEN_CATEGORIAS.includes(c)).sort(),
                ];
                const todas = [...ordenadas, "todos"];

                // Si no hay relojes cargados, arrancamos en la primera categoría que sí tenga productos
                if (!todas.includes(categoriaActiva)) categoriaActiva = todas[0];
                aplicarFondo(categoriaActiva);

                barraCategorias.style.display = "flex";
                barraCategorias.innerHTML = "";
                todas.forEach((cat) => {
                    const btn = document.createElement("button");
                    btn.className = "cat-btn" + (cat === categoriaActiva ? " activo" : "");
                    btn.textContent = cat === "todos" ? "Todos" : (NOMBRES_CATEGORIA[cat] || cat);
                    btn.onclick = () => {
                        categoriaActiva = cat;
                        [...barraCategorias.children].forEach(b => b.classList.remove("activo"));
                        btn.classList.add("activo");
                        aplicarFondo(cat);
                        pintarProductos(productos);
                    };
                    barraCategorias.appendChild(btn);
                });
            }

            fetch('./products.json?t=' + Date.now())
                .then(response => {
                    if (!response.ok) throw new Error("No se encontró el archivo products.json");
                    return response.json();
                })
                .then(productos => {
                    pintarBotonesCategoria(productos);
                    pintarProductos(productos);
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById("error-msg").style.display = "block";
                    document.getElementById("error-msg").innerText = "No se pudo cargar el catálogo. Intentá de nuevo en un momento.";
                });
        })();

        // Lógica del Modal
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImg");
        const closeModal = document.getElementById("closeModal");

        function abrirModal(rutaImagen) {
            modal.style.display = "flex";
            modalImg.src = rutaImagen;
        }

        closeModal.onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
